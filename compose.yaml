services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cognita_foundation}
      POSTGRES_USER: ${POSTGRES_USER:-cognita_foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_not_a_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [foundation]
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.10.0-trixie@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [foundation]
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cognita_foundation}:${POSTGRES_PASSWORD:-local_only_not_a_secret}@postgres:5432/${POSTGRES_DB:-cognita_foundation}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [foundation]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      SERVICE_VERSION: 0.1.0
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cognita_foundation}:${POSTGRES_PASSWORD:-local_only_not_a_secret}@postgres:5432/${POSTGRES_DB:-cognita_foundation}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_PUBLISH_RETRY_MS: ${JOB_PUBLISH_RETRY_MS:-1000}
      JOB_STALE_AFTER_MS: ${JOB_STALE_AFTER_MS:-5000}
      COMMERCIAL_INTERPRETATION_PROVIDER: fake
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [foundation, api-edge]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      SERVICE_VERSION: 0.1.0
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-cognita_foundation}:${POSTGRES_PASSWORD:-local_only_not_a_secret}@postgres:5432/${POSTGRES_DB:-cognita_foundation}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOB_PROCESSING_LEASE_MS: ${JOB_PROCESSING_LEASE_MS:-5000}
      JOB_PROCESS_RETRY_MS: ${JOB_PROCESS_RETRY_MS:-1000}
      JOB_RECOVERY_INTERVAL_MS: ${JOB_RECOVERY_INTERVAL_MS:-1000}
      JOB_RECOVERY_CLAIM_MS: ${JOB_RECOVERY_CLAIM_MS:-5000}
      JOB_RECOVERY_BATCH_SIZE: ${JOB_RECOVERY_BATCH_SIZE:-20}
      JOB_STALE_AFTER_MS: ${JOB_STALE_AFTER_MS:-5000}
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [foundation]

  n8n:
    image: n8nio/n8n:2.33.7@sha256:3989d9b8ebb77b4ee8f604519eb73e44f4384bfaa689526e0104eed79a237d30
    environment:
      DB_TYPE: sqlite
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    networks: [status, n8n-edge]
    volumes:
      - n8n_data:/home/node/.n8n

  cockpit:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: cockpit
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      WORKER_INTERNAL_URL: http://worker:3002
      N8N_INTERNAL_URL: http://n8n:5678
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      n8n:
        condition: service_healthy
    restart: unless-stopped
    networks: [foundation, status, cockpit-edge]

networks:
  api-edge:
  cockpit-edge:
  foundation:
    internal: true
  n8n-edge:
  status:
    internal: true

volumes:
  postgres_data:
  redis_data:
  n8n_data:
